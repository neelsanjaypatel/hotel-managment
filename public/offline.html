<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1e6b4e">
<title>No internet · Hotel Desk</title>
<style>
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 16px;
    background: #f5f4ef; color: #1c1c1a; font: 16px/1.5 system-ui, -apple-system, sans-serif; }
  .box { max-width: 340px; text-align: center; }
  .mark { width: 64px; height: 64px; margin: 0 auto 16px; border-radius: 14px; background: #1e6b4e;
    color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 26px; }
  h1 { font-size: 20px; margin: 0 0 6px; }
  p { margin: 0 0 20px; color: #6b6b66; font-size: 14px; }
  button { border: 0; border-radius: 8px; background: #1e6b4e; color: #fff; font: inherit;
    font-weight: 600; padding: 10px 20px; }
</style>
</head>
<body>
<div class="box">
  <div class="mark">HD</div>
  <h1>No internet</h1>
  <p>Hotel Desk needs internet to save and show entries. Check Wi-Fi or mobile data and try again.</p>
  <button onclick="location.reload()">Try again</button>
</div>
</body>
</html>
